<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FirstIn Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 32px; max-width: 480px; margin: 0 auto; color: #1a1a1a; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px; }
    input { width: 100%; padding: 8px 12px; border: 1px solid #d4d4d8; border-radius: 6px; font-size: 14px; font-family: monospace; }
    input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.1); }
    .hint { font-size: 12px; color: #888; margin-top: 4px; }
    button { padding: 8px 20px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .btn-primary { background: #18181b; color: white; }
    .btn-primary:hover { background: #27272a; }
    .btn-test { background: #e4e4e7; color: #18181b; margin-left: 8px; }
    .btn-test:hover { background: #d4d4d8; }
    .actions { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
    .status { font-size: 13px; margin-left: 12px; }
    .status-ok { color: #059669; }
    .status-err { color: #dc2626; }
  </style>
</head>
<body>
  <h1>FirstIn Extension Settings</h1>

  <div class="field">
    <label for="serverUrl">Server URL</label>
    <input type="url" id="serverUrl" placeholder="http://140.82.50.93">
    <div class="hint">Your FirstIn server address (include http:// or https://)</div>
  </div>

  <div class="field">
    <label for="apiToken">API Token</label>
    <input type="password" id="apiToken" placeholder="Paste token from Settings > Chrome Extension">
    <div class="hint">Generate in FirstIn Settings page</div>
  </div>

  <div class="actions">
    <button class="btn-primary" id="save">Save</button>
    <button class="btn-test" id="test">Test Connection</button>
    <span class="status" id="status"></span>
  </div>

  <script src="../../dist/options.js"></script>
</body>
</html>
