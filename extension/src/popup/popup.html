<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1a1a1a; }
    .header { padding: 12px 16px; background: #18181b; color: white; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 15px; font-weight: 700; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-green { background: #34d399; }
    .dot-red { background: #f87171; }
    .dot-gray { background: #9ca3af; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #e4e4e7; }
    .stat { background: white; padding: 10px 12px; text-align: center; }
    .stat-num { font-size: 20px; font-weight: 700; }
    .stat-label { font-size: 11px; color: #6b7280; margin-top: 2px; }
    .recent { padding: 12px; }
    .recent h3 { font-size: 12px; color: #6b7280; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    .job { padding: 6px 0; border-bottom: 1px solid #f4f4f5; }
    .job:last-child { border: none; }
    .job-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .job-meta { font-size: 11px; color: #6b7280; margin-top: 2px; }
    .footer { padding: 8px 12px; border-top: 1px solid #e4e4e7; display: flex; justify-content: space-between; }
    .footer a { font-size: 12px; color: #2563eb; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    .loading { padding: 32px; text-align: center; color: #6b7280; font-size: 13px; }
    .error { padding: 16px; text-align: center; color: #dc2626; font-size: 13px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>FirstIn</h1>
    <span id="connStatus"><span class="dot dot-gray"></span></span>
  </div>
  <div id="content"><div class="loading">Loading...</div></div>
  <div class="footer">
    <a href="#" id="openApp">Open FirstIn</a>
    <a href="#" id="openSettings">Settings</a>
  </div>
  <script src="../../dist/popup.js"></script>
</body>
</html>
